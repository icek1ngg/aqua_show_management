server:
  port: 8080
  servlet:
    session:
      # JWT authentication does not require Tomcat persistent servlet sessions.
      persistent: false

spring:
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]

  application:
    name: asms-backend

  datasource:
    url: "${DB_URL:jdbc:postgresql://localhost:5432/asms_db}"
    username: "${DB_USERNAME:asms_user}"
    password: "${DB_PASSWORD:asms_password}"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: "${JPA_DDL_AUTO:update}"
    open-in-view: false
    show-sql: "${JPA_SHOW_SQL:false}"
    properties:
      hibernate:
        format_sql: "${JPA_FORMAT_SQL:true}"

  data:
    redis:
      host: "${REDIS_HOST:localhost}"
      port: "${REDIS_PORT:6379}"
      password: "${REDIS_PASSWORD:}"

  rabbitmq:
    host: "${RABBITMQ_HOST:localhost}"
    port: "${RABBITMQ_PORT:5672}"
    username: "${RABBITMQ_USERNAME:asms_user}"
    password: "${RABBITMQ_PASSWORD:asms_password}"

  mail:
    host: "${GMAIL_HOST:smtp.gmail.com}"
    port: "${GMAIL_PORT:587}"
    username: "${GMAIL_USERNAME:}"
    password: "${GMAIL_APP_PASSWORD:}"
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: "${GOOGLE_CLIENT_ID:}"
            client-secret: "${GOOGLE_CLIENT_SECRET:}"
            scope:
              - openid
              - profile
              - email
            redirect-uri: "${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}"

asms:
  frontend:
    base-url: "${FRONTEND_BASE_URL:http://localhost:5173}"
  backend:
    base-url: "${BACKEND_BASE_URL:http://localhost:8080}"
  jwt:
    secret: "${JWT_SECRET:YOUR_LOCAL_JWT_SECRET}"
    expiration-ms: "${JWT_EXPIRATION:3600000}"
    refresh-token:
      short-lived-seconds: "${JWT_REFRESH_SHORT_SECONDS:604800}"
      remember-me-seconds: "${JWT_REFRESH_REMEMBER_ME_SECONDS:604800}"
      cookie-secure: "${JWT_REFRESH_COOKIE_SECURE:false}"
      cookie-same-site: "${JWT_REFRESH_COOKIE_SAME_SITE:Lax}"
  payos:
    client-id: "${PAYOS_CLIENT_ID:}"
    api-key: "${PAYOS_API_KEY:}"
    checksum-key: "${PAYOS_CHECKSUM_KEY:}"
    reconcile-delay-ms: "${PAYOS_RECONCILE_DELAY_MS:90000}"
