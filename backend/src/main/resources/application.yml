server:
  port: 8080
  tomcat:
    max-threads: 500
    accept-count: 1000
    max-connections: 10000
  servlet:
    session:
      # JWT authentication does not require Tomcat persistent servlet sessions.
      persistent: false

spring:
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]

  application:
    name: asms-backend

  datasource:
    url: "${DB_URL:jdbc:postgresql://localhost:5432/asms_db}"
    username: "${DB_USERNAME:asms_user}"
    password: "${DB_PASSWORD:asms_password}"
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 50

  jpa:
    hibernate:
      ddl-auto: "${JPA_DDL_AUTO:update}"
    open-in-view: false
    show-sql: "${JPA_SHOW_SQL:false}"
    properties:
      hibernate:
        format_sql: "${JPA_FORMAT_SQL:true}"

  data:
    redis:
      host: "${REDIS_HOST:localhost}"
      port: "${REDIS_PORT:6379}"
      password: "${REDIS_PASSWORD:}"

  rabbitmq:
    host: "${RABBITMQ_HOST:localhost}"
    port: "${RABBITMQ_PORT:5672}"
    username: "${RABBITMQ_USERNAME:asms_user}"
    password: "${RABBITMQ_PASSWORD:asms_password}"

  mail:
    host: "${GMAIL_HOST:smtp.gmail.com}"
    port: "${GMAIL_PORT:587}"
    username: "${GMAIL_USERNAME:}"
    password: "${GMAIL_APP_PASSWORD:}"
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # Three sequential network phases remain within the executor's 10-second shutdown window.
          connectiontimeout: 3000
          timeout: 3000
          writetimeout: 3000

  security:
    oauth2:
      client:
        registration:
          google:
            # Non-secret local fallbacks keep the application bootable before
            # real Google OAuth credentials are configured.
            client-id: "${GOOGLE_CLIENT_ID:google-oauth-disabled}"
            client-secret: "${GOOGLE_CLIENT_SECRET:google-oauth-disabled}"
            scope:
              - openid
              - profile
              - email
            redirect-uri: "${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}"

asms:
  auth:
    rate-limit:
      registration-ip-per-hour: "${AUTH_REGISTER_IP_PER_HOUR:10}"
      registration-email-per-hour: "${AUTH_REGISTER_EMAIL_PER_HOUR:3}"
      resend-cooldown-seconds: "${AUTH_RESEND_COOLDOWN_SECONDS:60}"
      resend-email-per-hour: "${AUTH_RESEND_EMAIL_PER_HOUR:5}"
      login-ip-per-15min: "${AUTH_LOGIN_IP_PER_15MIN:50}"
      login-email-ip-per-15min: "${AUTH_LOGIN_EMAIL_IP_PER_15MIN:5}"
      forgot-ip-per-hour: "${AUTH_FORGOT_IP_PER_HOUR:10}"
      forgot-email-per-hour: "${AUTH_FORGOT_EMAIL_PER_HOUR:3}"
      reset-ip-per-15min: "${AUTH_RESET_IP_PER_15MIN:10}"
      refresh-ip-per-min: "${AUTH_REFRESH_IP_PER_MIN:60}"
  frontend:
    base-url: "${FRONTEND_BASE_URL:http://localhost:5173}"
    allowed-origins: "${FRONTEND_ALLOWED_ORIGINS:${FRONTEND_BASE_URL:http://localhost:5173}}"
  backend:
    base-url: "${BACKEND_BASE_URL:http://localhost:8080}"
  jwt:
    secret: "${JWT_SECRET:YOUR_LOCAL_JWT_SECRET}"
    expiration-ms: 900000
    refresh-token:
      short-lived-seconds: "${JWT_REFRESH_SHORT_LIVED_SECONDS:86400}"
      remember-me-seconds: "${JWT_REFRESH_REMEMBER_ME_SECONDS:2592000}"
      cookie-secure: "${JWT_REFRESH_COOKIE_SECURE:false}"
      cookie-same-site: "${JWT_REFRESH_COOKIE_SAME_SITE:Lax}"
      secret: "${JWT_REFRESH_SECRET:YOUR_LOCAL_JWT_REFRESH_SECRET}"
  payos:
    client-id: "${PAYOS_CLIENT_ID:}"
    api-key: "${PAYOS_API_KEY:}"
    checksum-key: "${PAYOS_CHECKSUM_KEY:}"
    allow-unsigned-callbacks: "${PAYOS_ALLOW_UNSIGNED_CALLBACKS:false}"
